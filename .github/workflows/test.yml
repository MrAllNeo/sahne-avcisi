name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Kare çıkarma testleri gerçek FFmpeg ile klip üretip okuyor. Mock'lamak
      # yerine gerçeğini kullanmak, boru üzerinden indeksleme gibi yolların
      # gerçekten çalıştığını doğrulayan tek yol.
      - name: FFmpeg kur
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install
        run: pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile check
        run: python -m compileall -q src tests
